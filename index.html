<!DOCTYPE html>
<html>
<head>
  <title>My Login Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
    }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="login">
  <h2>Welcome Back</h2>
  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password">

  <button onclick="signup()">Create Account</button>
  <button onclick="login()">Login</button>
  <button onclick="logout()">Logout</button>

  <p id="message"></p>
</div>

<script>
const SUPABASE_URL = "https:// buvimzyppjfiaizbsxmk.supabase.co ";
const SUPABASE_KEY = "sb_publishable_aPmgGHBXDrjzB_XhBAz6xQ_0td-tUQw ";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function signup() {
  const { error } = await client.auth.signUp({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  });

  document.getElementById("message").textContent =
    error ? error.message : "Check your email to confirm your account.";
}

async function login() {
  const { error } = await client.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  });

  document.getElementById("message").textContent =
    error ? error.message : "Login successful!";
}

async function logout() {
  const { error } = await client.auth.signOut();
  document.getElementById("message").textContent =
    error ? error.message : "You have logged out.";
}
</script>

</body>
</html>
