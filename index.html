
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Login Website</title>

  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #e0e7ff);
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      color: #1e293b;
    }

    p {
      color: #64748b;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .logout {
      background: #dc2626;
    }

    .logout:hover {
      background: #b91c1c;
    }

    #message {
      margin-top: 20px;
      overflow-wrap: anywhere;
    }

    #account {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGIN AND SIGNUP -->

    <div id="loginSection">

      <h1>Welcome Back</h1>
      <p>Login to your account</p>

      <input
        type="email"
        id="email"
        placeholder="Email address"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button id="signupButton" onclick="signup()">
        Create Account
      </button>

      <button id="loginButton" onclick="login()">
        Login
      </button>

    </div>

    <!-- ACCOUNT PAGE -->

    <div id="account">

      <h1>Welcome!</h1>

      <p>You are successfully logged in.</p>

      <p id="userEmail"></p>

      <button class="logout" onclick="logout()">
        Logout
      </button>

    </div>

    <p id="message" role="status" aria-live="polite"></p>

  </div>

  <script>

    // SUPABASE CONFIGURATION

    const SUPABASE_URL =
      "https://buvimzyppifiaizbsxmk.supabase.co";

    const SUPABASE_KEY =
      "Sb_publishable_apmgGHBXDrjzB_XhBAz6x_0td-tuQw";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const message = document.getElementById("message");

    // MESSAGE FUNCTION

    function showMessage(text) {
      message.textContent = text;
    }

    // LOADING FUNCTION

    function setLoading(value) {
      document.getElementById("signupButton").disabled = value;
      document.getElementById("loginButton").disabled = value;
    }

    // CREATE ACCOUNT

    async function signup() {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMessage("Enter your email and password.");
        return;
      }

      setLoading(true);
      showMessage("Creating account...");

      try {

        const { data, error } = await client.auth.signUp({
          email: email,
          password: password,
          options: {
            emailRedirectTo: window.location.origin
          }
        });

        if (error) throw error;

        if (data.session) {
          showAccount(data.user);
          showMessage("Account created successfully!");
        } else {
          showMessage(
            "Account created! Please check your email to confirm."
          );
        }

      } catch (error) {
        showMessage("Signup error: " + error.message);
      }

      setLoading(false);
    }

    // LOGIN

    async function login() {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showMessage("Enter your email and password.");
        return;
      }

      setLoading(true);
      showMessage("Logging in...");

      try {

        const { data, error } =
          await client.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) throw error;

        showAccount(data.user);
        showMessage("Login successful!");

      } catch (error) {
        showMessage("Login error: " + error.message);
      }

      setLoading(false);
    }

    // SHOW ACCOUNT

    function showAccount(user) {

      document.getElementById("loginSection").style.display = "none";

      document.getElementById("account").style.display = "block";

      document.getElementById("userEmail").textContent =
        "Logged in as: " + user.email;
    }

    // LOGOUT

    async function logout() {

      showMessage("Logging out...");

      try {

        const { error } = await client.auth.signOut();

        if (error) throw error;

        document.getElementById("loginSection").style.display = "block";

        document.getElementById("account").style.display = "none";

        document.getElementById("email").value = "";
        document.getElementById("password").value = "";

        showMessage("You have successfully logged out!");

      } catch (error) {
        showMessage("Logout error: " + error.message);
      }
    }

    // CHECK EXISTING SESSION

    async function checkSession() {

      try {

        const { data, error } = await client.auth.getSession();

        if (error) throw error;

        if (data.session) {
          showAccount(data.session.user);
        }

      } catch (error) {
        showMessage("Session error: " + error.message);
      }
    }

    // START WEBSITE

    checkSession();

  </script>

</body>
</html>
